name: AI escape tests

# Runs the live escape tests against a real local model on every change to
# the AI package. Claude and Codex need a personal sign-in, so they run on a
# developer's Mac instead (see packages/ai/README.md).

on:
  pull_request:
    paths:
      - 'packages/ai/**'
      - '.github/workflows/ai-escape.yml'
  push:
    branches: [main]
    paths:
      - 'packages/ai/**'
      - '.github/workflows/ai-escape.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-escape-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Small enough for a CPU runner, supports tool calls, and doesn't spend time thinking.
          - model: qwen2.5:1.5b
            tests: packages/ai/src/live
          # What Macs under 16 GB label events with; it only labels, so only that test runs.
          - model: qwen2.5:0.5b
            tests: packages/ai/src/live/classifier.test.ts
    name: ollama (${{ matrix.model }})
    env:
      VIGIL_LIVE_PROVIDERS: ollama
      VIGIL_OLLAMA_MODEL: ${{ matrix.model }}
      OLLAMA_MODELS: /home/runner/.ollama-models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.ollama-models
          key: ollama-${{ env.VIGIL_OLLAMA_MODEL }}
      - name: Install Ollama (pinned tarball, checksum-verified)
        # Version-pinned tarball instead of the vendor's pipe-to-shell script:
        # nothing downloaded is executed before the committed checksum (the
        # release's own sha256sum.txt entry for ollama-linux-amd64.tar.zst,
        # verified when this pin was made) accepts the file. No system service
        # is created, so there is nothing to stop afterwards.
        run: |
          version=0.40.2
          curl -fsSL -o "$RUNNER_TEMP/ollama.tar.zst" \
            "https://github.com/ollama/ollama/releases/download/v${version}/ollama-linux-amd64.tar.zst"
          expected='726bee78706c281b0eeef00746efe51a044d71c592c3f0b195820707f31fdf04'
          echo "$expected  $RUNNER_TEMP/ollama.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ollama"
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama"
          echo "$RUNNER_TEMP/ollama/bin" >> "$GITHUB_PATH"
      - name: Start Ollama
        # Run as this user so the model cache above applies.
        run: |
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done
          ollama pull "$VIGIL_OLLAMA_MODEL"
      - run: pnpm exec vitest run ${{ matrix.tests }}
      - name: Ollama log
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/ollama.log"
