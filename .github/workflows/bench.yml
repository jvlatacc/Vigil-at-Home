name: Benchmarks

# How well Vigil works, rerun on every change that could move the numbers:
#   detection  simulated attacks and four weeks of normal use through the
#              rules, with full telemetry and through the real sensor parsers
#   labels     how well the local labelling model spots what the rules missed
#   flow       the whole response path on a real Mac: the real helper and
#              osquery, the popup, Keep blocked / Allow, block and undo
# Results are in each job's summary and log (lines starting VIGIL_BENCH) and
# in the run's artifacts. Only a regression fails: a canonical attack the
# rules stop catching, or a broken step in the flow.

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'apps/desktop/src/main/**'
      - 'apps/desktop/src/renderer/src/views/Popup.tsx'
      - 'apps/desktop/e2e/flow.e2e.mjs'
      - '.github/workflows/bench.yml'
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm --filter @vigil/bench bench
        env:
          BENCH_OUT: ${{ github.workspace }}/bench-results
      - if: always()
        run: node packages/bench/scripts/summary.mjs bench-results >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: bench-detection
          path: bench-results

  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # What Macs under 16 GB and over 16 GB label with (packages/ai classifier.ts).
        model: ['qwen2.5:0.5b', 'qwen2.5:1.5b']
    name: labels (${{ matrix.model }})
    env:
      VIGIL_BENCH_LABELLER: ollama
      VIGIL_OLLAMA_MODEL: ${{ matrix.model }}
      OLLAMA_MODELS: /home/runner/.ollama-models
      BENCH_OUT: ${{ github.workspace }}/bench-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.ollama-models
          key: ollama-${{ matrix.model }}
      - name: Install Ollama (pinned tarball, checksum-verified)
        # Version-pinned tarball instead of the vendor's pipe-to-shell script:
        # nothing downloaded is executed before the committed checksum (the
        # release's own sha256sum.txt entry for ollama-linux-amd64.tar.zst,
        # verified when this pin was made) accepts the file. No system service
        # is created, so there is nothing to stop afterwards.
        run: |
          version=0.40.2
          curl -fsSL -o "$RUNNER_TEMP/ollama.tar.zst" \
            "https://github.com/ollama/ollama/releases/download/v${version}/ollama-linux-amd64.tar.zst"
          expected='726bee78706c281b0eeef00746efe51a044d71c592c3f0b195820707f31fdf04'
          echo "$expected  $RUNNER_TEMP/ollama.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ollama"
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama"
          echo "$RUNNER_TEMP/ollama/bin" >> "$GITHUB_PATH"
      - name: Start Ollama
        # Run as this user so the model cache above applies.
        run: |
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done
          ollama pull "$VIGIL_OLLAMA_MODEL"
      - run: pnpm --filter @vigil/bench bench:labels
      - if: always()
        run: node packages/bench/scripts/summary.mjs bench-results >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: bench-labels-${{ strategy.job-index }}
          path: bench-results

  flow:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download Electron
        working-directory: apps/desktop
        # GitHub's release downloads now and then answer 500, so try three times.
        run: |
          for i in 1 2 3; do node node_modules/electron/install.js && exit 0; sleep 20; done
          exit 1
      - run: pnpm --filter @vigil/desktop build
      # osquery first, so the helper finds it and runs it.
      - run: brew install --cask osquery
      - name: Install the helper
        working-directory: apps/desktop
        run: |
          node scripts/build-helper.mjs --arch arm64
          h="$RUNNER_TEMP/Vigil at Home.app/Contents/Resources/helper"
          mkdir -p "$h"
          cp -R build/helper/common/* build/helper/darwin-arm64/node "$h/"
          sudo "$h/install.sh"
          test -S /var/run/vigil-helper.sock
          # Let osquery finish its first (baseline) run before the test.
          sleep 20
      - name: Run the flow
        working-directory: apps/desktop
        run: node e2e/flow.e2e.mjs "$GITHUB_WORKSPACE/bench-results"
      - if: always()
        run: node packages/bench/scripts/summary.mjs bench-results >> "$GITHUB_STEP_SUMMARY"
      - name: Helper log
        if: always()
        run: sudo tail -n 80 /Library/Logs/Vigil/helper.log || true
      - name: Remove the helper
        if: always()
        run: sudo "$RUNNER_TEMP/Vigil at Home.app/Contents/Resources/helper/uninstall.sh" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: bench-flow
          path: bench-results
