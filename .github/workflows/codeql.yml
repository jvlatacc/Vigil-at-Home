name: CodeQL

# Static security analysis of the TypeScript sources. Findings land under
# Security › Code scanning. Fork pull requests are skipped: their tokens may
# not write security events, and pull_request_target stays banned (see the
# 2026-10-09 audit). Same-repo PRs, pushes to main, and a weekly sweep run.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '35 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          languages: typescript
          build-mode: none
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          category: '/language:typescript'
