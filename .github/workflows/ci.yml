name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm check:naming
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          # No Claude or Codex logins here, so the real-CLI plan usage test is safe to run.
          VIGIL_TEST_REAL_CLI_USAGE: '1'
      - run: pnpm --filter @vigil/desktop build

  linux:
    # Root-only Linux integration tests (nftables blocks, process signals). Each
    # one is a *.integration.test.ts under a package's src/ and skips itself
    # unless VIGIL_LINUX_INTEGRATION=1, so the plain test run above ignores it.
    runs-on: ubuntu-latest
    # A full run takes about 10 minutes; a hang must not hold a runner for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Linux integration tests (root)
        run: |
          mapfile -t files < <(find apps packages -path '*/node_modules' -prune -o -path '*/src/*' -name '*.integration.test.ts' -print | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Linux integration tests yet."
            exit 0
          fi
          printf 'Running %s\n' "${files[@]}"
          command -v nft >/dev/null || sudo apt-get install -y nftables
          # One file at a time, in the sorted order above (Vitest would reorder
          # them): they install packages and start and stop the same system
          # services, so they must not overlap.
          for f in "${files[@]}"; do
            sudo -E env "PATH=$PATH" VIGIL_LINUX_INTEGRATION=1 pnpm vitest run "$f"
          done

  kernel-monitor:
    # The eBPF kernel monitor (kernel-monitor/): run its host-runnable C tests
    # and compile the CO-RE object against the Debian 12 (6.1) and Debian 13
    # (6.12) kernel BTFs. Loading and attaching the programs needs a real
    # Debian kernel with privileges, which hosted CI cannot provide — that
    # runtime check stays VM-pending (see kernel-monitor/README.md).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm gcc make cmake libbpf-dev \
            linux-tools-common linux-tools-generic \
            zstd xz-utils bzip2 gzip
          # Ubuntu ships bpftool as per-kernel versioned binaries under
          # /usr/lib/linux-tools*, and the /usr/sbin/bpftool wrapper demands
          # an exact running-kernel match that runner images cannot satisfy
          # (they boot kernels newer than the tools archive tracks). Every
          # use in this job is host-side (skeleton generation, BTF dump), so
          # link the newest installed binary directly, ahead of the wrapper.
          BPFTOOL_BIN=$(find /usr/lib/linux-tools* -name bpftool -type f | sort -V | tail -1)
          if [ -z "$BPFTOOL_BIN" ]; then
            echo "no bpftool binary installed by linux-tools-generic" >&2
            exit 1
          fi
          echo "using $BPFTOOL_BIN"
          sudo ln -sf "$BPFTOOL_BIN" /usr/local/bin/bpftool
          bpftool version
      - name: Host unit tests (ctest)
        run: make -C kernel-monitor test
      - name: Verifier pre-check
        run: kernel-monitor/scripts/run_verifier_check.sh
      - name: CO-RE compile against Debian 12 (6.1) kernel BTF
        run: kernel-monitor/scripts/ci_compile_btf.sh bookworm 6.1
      - name: CO-RE compile against Debian 13 (6.12) kernel BTF
        run: kernel-monitor/scripts/ci_compile_btf.sh trixie 6.12
      - name: Packaging checks (shellcheck, unit verify, rsyslog syntax, uninstall idempotency)
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck rsyslog
          sudo sh kernel-monitor/scripts/check_packaging.sh
  audit:
    # Advisory scan of what actually ships: --prod covers runtime
    # dependencies only. Advisories in the build-only electron-builder chain
    # are tracked out of band (no runtime exposure).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm audit --prod

  dependency-review:
    # PRs that change dependency manifests get a diff-level review of the
    # change (new advisories, license flips) before merge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: supported
        # The dependency-review API 403s while the repository's dependency
        # graph is off (forks ship with it disabled). Probe it and skip with
        # a loud warning instead of failing every pull request until the
        # setting is flipped; the job starts enforcing as soon as it is.
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/dependency-graph/compare/$BASE...$HEAD" > /dev/null 2>&1; then
            echo "supported=yes" >> "$GITHUB_OUTPUT"
          else
            echo "supported=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency graph is disabled, so dependency review is skipped. Enable it at Settings > Code security: https://github.com/$GITHUB_REPOSITORY/settings/security_analysis"
          fi
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: steps.supported.outputs.supported == 'yes'

  appliance:
    # Appliance shell gate (POSIX sh — there is no Node.js on device):
    # shellcheck every appliance shell file with zero findings, then run the
    # hermetic bats suite. Existing TS jobs above are untouched;
    # appliance/ is deliberately not a pnpm workspace member.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Shellcheck appliance shell (zero findings)
        run: shellcheck $(find appliance -type f -name '*.sh')
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: Bats fragment and flag contracts
        run: bats appliance/opnsense/tests