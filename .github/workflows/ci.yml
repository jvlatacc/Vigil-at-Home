name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm check:naming
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          # No Claude or Codex logins here, so the real-CLI plan usage test is safe to run.
          VIGIL_TEST_REAL_CLI_USAGE: '1'
      - run: pnpm --filter @vigil/desktop build

  linux:
    # Root-only Linux integration tests (nftables blocks, process signals). Each
    # one is a *.integration.test.ts under a package's src/ and skips itself
    # unless VIGIL_LINUX_INTEGRATION=1, so the plain test run above ignores it.
    runs-on: ubuntu-latest
    # A full run takes about 10 minutes; a hang must not hold a runner for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Linux integration tests (root)
        run: |
          mapfile -t files < <(find apps packages -path '*/node_modules' -prune -o -path '*/src/*' -name '*.integration.test.ts' -print | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Linux integration tests yet."
            exit 0
          fi
          printf 'Running %s\n' "${files[@]}"
          command -v nft >/dev/null || sudo apt-get install -y nftables
          # One file at a time, in the sorted order above (Vitest would reorder
          # them): they install packages and start and stop the same system
          # services, so they must not overlap.
          for f in "${files[@]}"; do
            sudo -E env "PATH=$PATH" VIGIL_LINUX_INTEGRATION=1 pnpm vitest run "$f"
          done

  appliance:
    # Appliance shell gate (POSIX sh — there is no Node.js on device):
    # shellcheck every appliance shell file with zero findings, then run the
    # hermetic bats suite. Existing TS jobs above are untouched;
    # appliance/ is deliberately not a pnpm workspace member.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck appliance shell (zero findings)
        run: shellcheck $(find appliance -type f -name '*.sh')
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: Bats fragment and flag contracts
        run: bats appliance/opnsense/tests
