# Version updates, grouped weekly so they arrive as a few PRs rather than dozens.
# Security updates are separate and come as soon as an advisory is published
# (turned on in Settings › Advanced Security).
version: 2
updates:
  - package-ecosystem: npm
    # Globs instead of a single `directory: /`, which does not discover pnpm
    # workspace manifests — without them, apps/* and packages/* go unwatched.
    directories: ['/', '/apps/*', '/packages/*']
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
