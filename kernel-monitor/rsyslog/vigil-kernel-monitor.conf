# Installed by kernel-monitor/scripts/install.sh as /etc/rsyslog.d/vigil-kernel-monitor.conf
# (root-owned, with a *.before-vigil backup of any existing file).
# Local retention for admins and external collectors. The Vigil app does NOT
# tail this file — it tails the JSONL index directly. Nothing tails both.
if $programname == 'vigil-kernel-monitor' then {
	action(type="omfile" file="/var/log/vigil/kernel-monitor.log" fileCreateMode="0600" dirCreateMode="0700")
	stop
}
