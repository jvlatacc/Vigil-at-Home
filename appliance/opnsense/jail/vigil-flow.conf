# vigil-flow jail — reference fragment.
# install.sh writes this file (with the --ip address substituted) to
# /etc/jail.conf.d/vigil-flow.conf, and ensures /etc/jail.conf carries
# `.include "/etc/jail.conf.d/*.conf";` — jail(8) reads jail.conf.d only
# through that directive. Non-VNET: the jail shares the host network stack so
# softflowd inside it can open the unhidden /dev/bpf* devices on host
# interfaces (component spec: locked decision 1).

vigil-flow {
  devfs_ruleset = 5;  # [devfsrules_vigil_flow] — grants /dev/bpf* visibility
  mount.devfs;
  path = /var/vigil-flow/jail;
  ip4.addr = 192.0.2.254;  # replaced with the --ip flag value by install.sh
  exec.start = "/usr/local/bin/vigil-flow-ctl.sh start";
  exec.stop = "/usr/local/bin/vigil-flow-ctl.sh stop";
  persist;
}
