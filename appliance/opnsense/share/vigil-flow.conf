# vigil-flow sensor configuration — reference template carrying the exact
# keys from the component spec. install.sh writes the real file (flags
# substituted) to <jail>/etc/vigil-flow.conf, and vigil-flow-ctl.sh validate
# (sensor component) checks it before the supervisor ever starts.

# Capture on these host interfaces, seen through unhidden /dev/bpf*.
capture_interfaces = "lan0"

# Off-device NetFlow collector. Default port per product decision: 2550.
collector_host = "192.0.2.10"
collector_port = "2550"

# 9 | ipfix (maps to softflowd -v 9 | -v 10)
netflow_version = "9"

# Flow timeouts and limits (passed to softflowd -t / -m).
active_timeout = "300"
inactive_timeout = "30"
max_flows = "8192"

# Health/status output (JSON, rewritten on every transition and stats poll).
status_file = "/var/db/vigil-flow/status.json"
